&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    #kkai-network-draft {

      --kk-red-soft: light-dark(#fdecef, #4e252b);

      border-radius: 50%;

      position: relative;

    #kkai-network-draft .kk-brand-mark::after {

      inset: 6px;
      border-radius: 50%;
      background: var(--kk-surface);
    }
    #kkai-network-draft .kk-top-right { color: var(--kk-muted); font-weight: 400; }
    #kkai-network-draft .kk-context { padding: 30px 28px; max-width: 470px; }

      font-size: 21px;
      line-height: 1.3;
      font-weight: 500;
      margin: 0 0 9px;

    #kkai-network-draft .kk-context p { font-size: 12px; color: var(--kk-muted); margin: 0; }
    #kkai-network-draft .kk-context-rule { height: 1px; background: var(--kk-line); margin-top: 28px; width: 66%; }
    #kkai-network-draft .kk-context-lines { display: grid; gap: 13px; margin-top: 23px; width: 65%; opacity: .55; }
    #kkai-network-draft .kk-context-lines i { display: block; height: 8px; background: var(--kk-line); border-radius: 3px; }
    #kkai-network-draft .kk-context-lines i:nth-child(2) { width: 74%; }
    #kkai-network-draft .kk-context-lines i:nth-child(3) { width: 88%; }
    #kkai-network-draft .kk-widget { position: absolute; inset: 0; pointer-events: none; }
    #kkai-network-draft .kk-widget button { font: inherit; }
    #kkai-network-draft .kk-launcher {

    #kkai-network-draft .kk-widget[data-state=&quot;idle&quot;]:has(.kk-panel[hidden]) .kk-launcher:hover .kk-launcher-avatar,
    #kkai-network-draft .kk-widget[data-state=&quot;idle&quot;]:has(.kk-panel[hidden]) .kk-launcher:focus-visible .kk-launcher-avatar,
    #kkai-network-draft .kk-launcher:hover .kk-launcher-avatar,
    #kkai-network-draft .kk-launcher:focus-visible .kk-launcher-avatar { animation: kk-wave .32s ease-out 1; }
    #kkai-network-draft .kk-panel {
      pointer-events: auto;
      position: absolute;
      right: 22px;
      bottom: 89px;
      width: min(360px, calc(100% - 24px));
      background: var(--kk-surface);
      border: 1px solid var(--kk-line);
      border-radius: 20px;
      box-shadow: var(--kk-shadow);
      overflow: hidden;
      transform-origin: bottom right;
      animation: kk-appear .22s cubic-bezier(.2,.8,.2,1) both;
    }
    #kkai-network-draft .kk-widget[data-dragging=&quot;true&quot;] .kk-panel { box-shadow: 0 25px 60px rgba(28,48,63,.24); }
    #kkai-network-draft .kk-panel[hidden] { display: none; }
    #kkai-network-draft .kk-panel-header {
      position: relative;
      height: 160px;
      padding: 20px 20px 0;
      background: linear-gradient(115deg, var(--kk-blue-soft), var(--kk-surface));
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    #kkai-network-draft .kk-widget[data-dragging=&quot;true&quot;] .kk-panel-header { cursor: grabbing; }
    #kkai-network-draft .kk-drag-grip {
      position: absolute;
      z-index: 2;
      top: 3px;
      left: calc(50% - 20px);
      display: grid;
      place-items: center;
      width: 40px;
      height: 20px;
      padding: 0;
      border: 0;
      color: var(--kk-muted);
      background: transparent;
      cursor: grab;
    }
    #kkai-network-draft .kk-drag-grip svg { width: 16px; height: 16px; }
    #kkai-network-draft .kk-widget[data-dragging=&quot;true&quot;] .kk-drag-grip { cursor: grabbing; }
    #kkai-network-draft .kk-eyebrow { display: flex; align-items: center; gap: 6px; color: var(--kk-blue); font-size: 11px; font-weight: 500; }
    #kkai-network-draft .kk-eyebrow svg { width: 14px; height: 14px; }
    #kkai-network-draft .kk-panel-title { margin: 11px 0 4px; font-size: 20px; line-height: 1.25; font-weight: 500; }
    #kkai-network-draft .kk-host { color: var(--kk-muted); font-size: 12px; margin: 0; }
    #kkai-network-draft .kk-close {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 0;
      background: transparent;
      color: var(--kk-muted);
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    #kkai-network-draft .kk-close:hover { background: rgba(89,125,145,.13); color: var(--kk-ink); }
    #kkai-network-draft .kk-close svg { width: 16px; height: 16px; }

    #kkai-network-draft .kk-widget[data-state=&quot;testing&quot;] .kk-character { background-position: 100% 0; animation: kk-scan-bob 1.1s ease-in-out infinite; }
    #kkai-network-draft .kk-widget[data-state=&quot;good&quot;] .kk-character { background-position: 0 100%; animation: kk-celebrate .48s ease-out 1; }
    #kkai-network-draft .kk-widget[data-state=&quot;weak&quot;] .kk-character,
    #kkai-network-draft .kk-widget[data-state=&quot;fail&quot;] .kk-character { background-position: 100% 100%; }
    #kkai-network-draft .kk-signal {
      position: absolute;
      right: 18px;
      top: 36px;
      width: 28px;
      height: 28px;
      color: var(--kk-blue);
      opacity: 0;
    }
    #kkai-network-draft .kk-signal svg { width: 28px; height: 28px; }
    #kkai-network-draft .kk-widget[data-state=&quot;testing&quot;] .kk-signal { opacity: 1; animation: kk-signal 1.2s ease-in-out infinite; }
    #kkai-network-draft[data-paused=&quot;true&quot;] .kk-widget *,
    #kkai-network-draft .kk-widget[data-dragging=&quot;true&quot;] .kk-character { animation-play-state: paused; }
    #kkai-network-draft .kk-panel-main { padding: 19px 20px 17px; }
    #kkai-network-draft .kk-metric-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 21px; }
    #kkai-network-draft .kk-label { color: var(--kk-muted); font-size: 12px; }
    #kkai-network-draft .kk-verdict {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 20px;
      color: var(--kk-blue);
      background: var(--kk-blue-soft);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    #kkai-network-draft .kk-verdict::before { content: &#x27;&#x27;; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    #kkai-network-draft .kk-widget[data-state=&quot;good&quot;] .kk-verdict { background: var(--kk-green-soft); color: var(--kk-green); }
    #kkai-network-draft .kk-widget[data-state=&quot;weak&quot;] .kk-verdict { background: var(--kk-amber-soft); color: var(--kk-amber); }
    #kkai-network-draft .kk-widget[data-state=&quot;fail&quot;] .kk-verdict { background: var(--kk-red-soft); color: var(--kk-red); }
    #kkai-network-draft .kk-metric {
      height: 70px;
      display: flex;
      align-items: baseline;
      gap: 5px;
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    #kkai-network-draft .kk-number { font-size: 45px; line-height: 1.3; font-weight: 500; letter-spacing: 0; }
    #kkai-network-draft .kk-unit { color: var(--kk-muted); font-size: 16px; }
    #kkai-network-draft .kk-interpretation { height: 19px; margin: 0 0 15px; color: var(--kk-muted); font-size: 12px; }
    #kkai-network-draft .kk-samples { height: 42px; display: flex; align-items: end; gap: 7px; margin-bottom: 11px; }
    #kkai-network-draft .kk-sample {
      flex: 1;
      height: 8px;
      border-radius: 3px 3px 0 0;
      background: var(--kk-line);
      transition: height .3s ease, background-color .3s ease;
    }
    #kkai-network-draft .kk-sample.is-filled { background: var(--kk-blue); }
    #kkai-network-draft .kk-widget[data-state=&quot;good&quot;] .kk-sample.is-filled { background: var(--kk-green); }
    #kkai-network-draft .kk-widget[data-state=&quot;weak&quot;] .kk-sample.is-filled { background: var(--kk-amber); }
    #kkai-network-draft .kk-sample.is-failed { height: 8px !important; background: var(--kk-red); }
    #kkai-network-draft .kk-samples-caption { color: var(--kk-muted); font-size: 11px; margin: 0 0 17px; }
    #kkai-network-draft .kk-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--kk-blue);
      color: light-dark(#ffffff, #102333);
      font-size: 13px;
      font-weight: 500;
      transition: filter .15s ease, transform .15s ease;
    }
    #kkai-network-draft .kk-action:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    #kkai-network-draft .kk-action:disabled { opacity: .7; }
    #kkai-network-draft .kk-action svg { width: 15px; height: 15px; }
    #kkai-network-draft .kk-foot { padding-top: 13px; text-align: center; color: var(--kk-muted); font-size: 11px; }
    #kkai-network-draft .kk-launcher-note {
      position: absolute;
      right: 68px;
      bottom: 7px;
      padding: 10px 13px;
      border: 1px solid var(--kk-line);
      border-radius: 12px 12px 3px 12px;
      background: var(--kk-surface);
      box-shadow: 0 4px 18px rgba(24,70,94,.09);
      color: var(--kk-ink);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(5px);
      transition: opacity .16s ease, transform .16s ease;
      pointer-events: none;
    }
    #kkai-network-draft .kk-launcher[aria-expanded=&quot;false&quot;]:hover .kk-launcher-note,
    #kkai-network-draft .kk-launcher[aria-expanded=&quot;false&quot;]:focus-visible .kk-launcher-note { opacity: 1; transform: translateX(0); }
    #kkai-network-draft .kk-widget[data-state=&quot;good&quot;] .kk-launcher-dot { background: var(--kk-green); }
    #kkai-network-draft .kk-widget[data-state=&quot;weak&quot;] .kk-launcher-dot { background: var(--kk-amber); }
    #kkai-network-draft .kk-widget[data-state=&quot;fail&quot;] .kk-launcher-dot { background: var(--kk-red); }
    #kkai-network-draft .kk-widget[data-state=&quot;testing&quot;] .kk-launcher-dot { animation: kk-signal 1s ease-in-out infinite; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-panel { width: min(380px, calc(100% - 24px)); }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-panel-header { height: 91px; background: var(--kk-surface); border-bottom: 1px solid var(--kk-line); padding-left: 90px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-panel-title { margin-top: 8px; font-size: 17px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-eyebrow { display: none; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-character { width: 78px; height: 78px; left: 12px; right: auto; bottom: 2px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-signal { top: 12px; right: 47px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-panel-main { padding: 22px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-metric-head { flex-direction: row-reverse; justify-content: space-between; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-metric { height: 85px; align-items: center; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-number { font-size: 58px; }
    #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-samples { margin-top: 19px; }
    @keyframes kk-appear { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes kk-idle { 0%,72%,100% { transform: translateY(0) scale(1); } 80% { transform: translateY(-2px) scale(1.025); } 88% { transform: translateY(0) scale(1); } }
    @keyframes kk-dot-glint { 0%,72%,100% { box-shadow: none; } 78% { box-shadow: 0 0 0 4px var(--kk-blue-soft); } 86% { box-shadow: none; } }
    @keyframes kk-wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-10deg) translateY(-2px); } }
    @keyframes kk-celebrate { 0% { transform: translateY(3px) scale(.96); } 58% { transform: translateY(-5px) scale(1.02); } 100% { transform: translateY(0) scale(1); } }
    @keyframes kk-scan-bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes kk-signal { 0%,100% { opacity: .22; transform: scale(.88); } 50% { opacity: .88; transform: scale(1.06); } }
    @media (max-width: 500px) {
      #kkai-network-draft .kk-stage { min-height: 635px; }
      #kkai-network-draft .kk-context { padding: 23px 18px; }
      #kkai-network-draft .kk-context h2 { font-size: 18px; }
      #kkai-network-draft .kk-context-lines { width: 90%; }
      #kkai-network-draft .kk-panel,
      #kkai-network-draft .kk-widget[data-design=&quot;signal&quot;] .kk-panel {
        right: 0;
        bottom: 0;
        width: 100%;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;kkai-network-draft&#x27;);
      root.dataset.paused = String(document.hidden);
      document.addEventListener(&#x27;visibilitychange&#x27;, () =&gt; { root.dataset.paused = String(document.hidden); });
      const saved = window.openai?.widgetState?.privateContent || {};
      const sessions = {};
      function remember() {
        if (!window.openai?.setWidgetState) return;
        window.openai.setWidgetState({ modelContent: { design: &#x27;KKAI 云朵网络诊断&#x27;, simulated: true }, privateContent: sessions }).catch(() =&gt; {});
      }
      const outcomes = {
        good: { samples: [124, 139, 132, 151, 144], verdict: &#x27;连接顺畅&#x27;, detail: &#x27;响应稳定&#x27;, caption: &#x27;5 次采样 · 0 次失败&#x27; },
        weak: { samples: [232, 587, null, 316, 742], verdict: &#x27;连接波动明显&#x27;, detail: &#x27;建议切换网络或 VPN 节点后重测&#x27;, caption: &#x27;5 次采样 · 1 次失败&#x27; },
        fail: { samples: [null, null, null, null, null], verdict: &#x27;无法连接 API&#x27;, detail: &#x27;请检查当前网络后重测&#x27;, caption: &#x27;5 次采样 · 5 次失败&#x27; },
      };
      root.querySelectorAll(&#x27;.kk-widget&#x27;).forEach((widget) =&gt; {
        const panel = widget.querySelector(&#x27;.kk-panel&#x27;);
        const stage = widget.closest(&#x27;.kk-stage&#x27;);
        const header = widget.querySelector(&#x27;.kk-panel-header&#x27;);
        const grip = widget.querySelector(&#x27;.kk-drag-grip&#x27;);
        const launcher = widget.querySelector(&#x27;.kk-launcher&#x27;);
        const close = widget.querySelector(&#x27;.kk-close&#x27;);
        const action = widget.querySelector(&#x27;.kk-action&#x27;);
        const bars = [...widget.querySelectorAll(&#x27;.kk-sample&#x27;)];
        const prior = saved[widget.dataset.design];
        const preview = {
          outcome: outcomes[prior?.outcome] ? prior.outcome : &#x27;good&#x27;,
          open: typeof prior?.open === &#x27;boolean&#x27; ? prior.open : true,
          panelX: Number.isFinite(prior?.panelX) ? prior.panelX : 0,
          panelY: Number.isFinite(prior?.panelY) ? prior.panelY : 0,
        };
        let state = outcomes[prior?.state] ? prior.state : &#x27;idle&#x27;;
        let count = 0;
        let timer;
        function render() {
          const data = outcomes[preview.outcome];
          const visible = state === &#x27;testing&#x27; ? count : (state === &#x27;idle&#x27; ? 0 : 5);
          widget.dataset.state = state;
          panel.hidden = !preview.open;
          panel.style.translate = matchMedia(&#x27;(max-width: 500px)&#x27;).matches ? &#x27;0px 0px&#x27; : `${preview.panelX}px ${preview.panelY}px`;
          panel.style.setProperty(&#x27;--kk-swipe-y&#x27;, &#x27;0px&#x27;);
          launcher.setAttribute(&#x27;aria-expanded&#x27;, String(preview.open));
          launcher.setAttribute(&#x27;aria-label&#x27;, preview.open ? &#x27;收起网络诊断&#x27; : &#x27;打开网络诊断&#x27;);
          widget.querySelector(&#x27;.kk-verdict&#x27;).textContent = state === &#x27;idle&#x27; ? &#x27;等待检测&#x27; : (state === &#x27;testing&#x27; ? &#x27;正在检测&#x27; : data.verdict);
          widget.querySelector(&#x27;.kk-interpretation&#x27;).textContent = state === &#x27;idle&#x27; ? &#x27;点击下方按钮开始&#x27; : (state === &#x27;testing&#x27; ? `正在连接 API · ${count}/5` : data.detail);
          const valid = data.samples.filter((sample) =&gt; sample !== null);
          const average = valid.length ? Math.round(valid.reduce((sum, sample) =&gt; sum + sample, 0) / valid.length) : null;
          widget.querySelector(&#x27;.kk-number&#x27;).textContent = state === &#x27;idle&#x27; ? &#x27;--&#x27; : (state === &#x27;testing&#x27; ? `${count}/5` : (average === null ? &#x27;--&#x27; : String(average)));
          widget.querySelector(&#x27;.kk-unit&#x27;).textContent = state === &#x27;testing&#x27; ? &#x27;次&#x27; : &#x27;ms&#x27;;
          widget.querySelector(&#x27;.kk-samples-caption&#x27;).textContent = state === &#x27;testing&#x27; ? `已完成 ${count} 次 · 共 5 次` : (state === &#x27;idle&#x27; ? &#x27;5 次采样&#x27; : data.caption);
          action.disabled = state === &#x27;testing&#x27;;
          action.querySelector(&#x27;span&#x27;).textContent = state === &#x27;testing&#x27; ? &#x27;检测中&#x27; : (state === &#x27;idle&#x27; ? &#x27;开始检测&#x27; : &#x27;重新检测&#x27;);
          bars.forEach((bar, index) =&gt; {
            const sample = data.samples[index];
            bar.classList.toggle(&#x27;is-filled&#x27;, index &lt; visible &amp;&amp; sample !== null);
            bar.classList.toggle(&#x27;is-failed&#x27;, index &lt; visible &amp;&amp; sample === null);
            bar.style.height = index &lt; visible &amp;&amp; sample !== null ? `${Math.max(10, sample / Math.max(...valid, 1) * 41)}px` : &#x27;8px&#x27;;
            bar.setAttribute(&#x27;data-tooltip&#x27;, index &lt; visible ? `第 ${index + 1} 次：${sample === null ? &#x27;超时&#x27; : sample + &#x27; ms&#x27;}` : `第 ${index + 1} 次：待检测`);
          });
          sessions[widget.dataset.design] = { outcome: preview.outcome, open: preview.open, state: state === &#x27;testing&#x27; ? &#x27;idle&#x27; : state, panelX: preview.panelX, panelY: preview.panelY };
        }
        function clampPanel() {
          if (panel.hidden || matchMedia(&#x27;(max-width: 500px)&#x27;).matches) return;
          const box = panel.getBoundingClientRect();
          const bounds = stage.getBoundingClientRect();
          const edge = 12;
          if (box.left &lt; bounds.left + edge) preview.panelX += bounds.left + edge - box.left;
          if (box.right &gt; bounds.right - edge) preview.panelX += bounds.right - edge - box.right;
          if (box.top &lt; bounds.top + edge) preview.panelY += bounds.top + edge - box.top;
          if (box.bottom &gt; bounds.bottom - edge) preview.panelY += bounds.bottom - edge - box.bottom;
          panel.style.translate = `${preview.panelX}px ${preview.panelY}px`;
        }
        header.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
          if (event.button !== 0 || event.target.closest(&#x27;.kk-close&#x27;)) return;
          const mobile = matchMedia(&#x27;(max-width: 500px)&#x27;).matches;
          const origin = panel.getBoundingClientRect();
          const bounds = stage.getBoundingClientRect();
          const startX = event.clientX;
          const startY = event.clientY;
          const initialX = preview.panelX;
          const initialY = preview.panelY;
          let moved = false;
          header.setPointerCapture(event.pointerId);
          const onMove = (move) =&gt; {
            const dx = move.clientX - startX;
            const dy = move.clientY - startY;
            if (!moved &amp;&amp; Math.hypot(dx, dy) &lt; 5) return;
            moved = true;
            widget.dataset.dragging = &#x27;true&#x27;;
            if (mobile) {
              panel.style.setProperty(&#x27;--kk-swipe-y&#x27;, `${Math.max(0, dy)}px`);
              return;
            }
            preview.panelX = Math.max(initialX + bounds.left + 12 - origin.left, Math.min(initialX + bounds.right - 12 - origin.right, initialX + dx));
            preview.panelY = Math.max(initialY + bounds.top + 12 - origin.top, Math.min(initialY + bounds.bottom - 12 - origin.bottom, initialY + dy));
            panel.style.translate = `${preview.panelX}px ${preview.panelY}px`;
          };
          const finish = (end) =&gt; {
            header.removeEventListener(&#x27;pointermove&#x27;, onMove);
            header.removeEventListener(&#x27;pointerup&#x27;, finish);
            header.removeEventListener(&#x27;pointercancel&#x27;, finish);
            if (header.hasPointerCapture(end.pointerId)) header.releasePointerCapture(end.pointerId);
            delete widget.dataset.dragging;
            if (mobile) {
              panel.style.setProperty(&#x27;--kk-swipe-y&#x27;, &#x27;0px&#x27;);
              if (moved &amp;&amp; end.type === &#x27;pointerup&#x27; &amp;&amp; end.clientY - startY &gt; 90) {
                preview.open = false;
                render();
                launcher.focus();
              }
            }
            if (moved) { render(); remember(); }
          };
          header.addEventListener(&#x27;pointermove&#x27;, onMove);
          header.addEventListener(&#x27;pointerup&#x27;, finish);
          header.addEventListener(&#x27;pointercancel&#x27;, finish);
        });
        grip.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
          if (matchMedia(&#x27;(max-width: 500px)&#x27;).matches || !event.key.startsWith(&#x27;Arrow&#x27;)) return;
          event.preventDefault();
          const step = event.shiftKey ? 32 : 12;
          if (event.key === &#x27;ArrowLeft&#x27;) preview.panelX -= step;
          if (event.key === &#x27;ArrowRight&#x27;) preview.panelX += step;
          if (event.key === &#x27;ArrowUp&#x27;) preview.panelY -= step;
          if (event.key === &#x27;ArrowDown&#x27;) preview.panelY += step;
          panel.style.translate = `${preview.panelX}px ${preview.panelY}px`;
          clampPanel();
          render();
          remember();
        });
        action.addEventListener(&#x27;click&#x27;, () =&gt; {
          clearTimeout(timer);
          preview.open = true;
          state = &#x27;testing&#x27;;
          count = 0;
          render();
          const tick = () =&gt; {
            count += 1;
            if (count &lt; 5) {
              render();
              timer = setTimeout(tick, 540);
            } else {
              state = preview.outcome;
              render();
              remember();
            }
          };
          timer = setTimeout(tick, 540);
        });
        launcher.addEventListener(&#x27;click&#x27;, () =&gt; { preview.open = !preview.open; render(); requestAnimationFrame(clampPanel); remember(); });
        close.addEventListener(&#x27;click&#x27;, () =&gt; { preview.open = false; render(); launcher.focus(); remember(); });
        widget.addEventListener(&#x27;keydown&#x27;, (event) =&gt; { if (event.key === &#x27;Escape&#x27; &amp;&amp; preview.open) { preview.open = false; render(); launcher.focus(); remember(); } });
        window.addEventListener(&#x27;openai:set_globals&#x27;, (event) =&gt; {
          const next = event.detail?.globals?.widgetState?.privateContent?.[widget.dataset.design];
          if (!next) return;
          clearTimeout(timer);
          preview.outcome = outcomes[next.outcome] ? next.outcome : &#x27;good&#x27;;
          preview.open = typeof next.open === &#x27;boolean&#x27; ? next.open : true;
          preview.panelX = Number.isFinite(next.panelX) ? next.panelX : 0;
          preview.panelY = Number.isFinite(next.panelY) ? next.panelY : 0;
          state = outcomes[next.state] ? next.state : &#x27;idle&#x27;;
          render();
          requestAnimationFrame(clampPanel);
        });
        window.addEventListener(&#x27;resize&#x27;, () =&gt; { render(); requestAnimationFrame(clampPanel); });
        matchMedia(&#x27;(max-width: 500px)&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { render(); requestAnimationFrame(clampPanel); });
        render();
        requestAnimationFrame(clampPanel);
        if (globalThis.Tweak) {
          const tweak = new Tweak({ container: widget, onChange: () =&gt; { clearTimeout(timer); state = preview.outcome; count = 5; render(); remember(); } });
          tweak.addSelect(preview, &#x27;outcome&#x27;, { label: &#x27;诊断结果&#x27;, options: [{ label: &#x27;连接顺畅&#x27;, value: &#x27;good&#x27; }, { label: &#x27;连接波动&#x27;, value: &#x27;weak&#x27; }, { label: &#x27;连接失败&#x27;, value: &#x27;fail&#x27; }] });
          tweak.addToggle(preview, &#x27;open&#x27;, { label: &#x27;展开浮窗&#x27; });
        }
      });
    })();
  &lt;/script&gt;

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
