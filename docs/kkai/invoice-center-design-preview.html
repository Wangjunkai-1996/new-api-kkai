<script>
(() => {
  const root = document.getElementById('kkai-invoice-design');
  const content = root.querySelector('#iv-content');
  const modal = root.querySelector('#iv-modal');
  const orders = [
    {id:'o1',name:'账户充值',kind:'充值',trade:'TOP-20261021-0081',date:'2026.10.21 14:32',pay:'支付宝',amount:50000,eligible:false,claimedBy:'INV-20261022-0036',reason:'已被申请 INV-20261022-0036 占用'},
    {id:'o2',name:'专业会员 · 月度订阅',kind:'会员订阅',trade:'MEMBER-20261020-0168',date:'2026.10.20 09:15',pay:'微信支付',amount:69900,eligible:false,claimedBy:'INV-20261022-0036',reason:'已被申请 INV-20261022-0036 占用'},
    {id:'o3',name:'账户充值',kind:'充值',trade:'TOP-20261018-0063',date:'2026.10.18 16:08',pay:'支付宝',amount:100000,eligible:true},
    {id:'o4',name:'基础会员 · 月度订阅',kind:'会员订阅',trade:'MEMBER-20261012-0042',date:'2026.10.12 10:26',pay:'支付宝',amount:29900,eligible:true},
    {id:'o5',name:'历史订阅订单',kind:'会员订阅',trade:'SUB-20260408-0029',date:'2026.04.08 11:20',pay:'历史订单',amount:null,eligible:false,reason:'缺少实收凭证，暂不可申请'}
  ];
  const requests = [
    {id:'INV-20261022-0036',orderIds:['o1','o2'],title:'上海示例科技有限公司',amount:119900,status:'pending_review',sources:'充值 + 会员订阅',count:2,date:'2026.10.22 10:24',tax:'91310000XXXXXXXXXX',email:'finance@example.com',events:[['申请已提交','2026.10.22 10:24','已收到申请，等待财务审核。']]},
    {id:'INV-20261019-0028',title:'上海示例科技有限公司',amount:80000,status:'delivered',sources:'账户充值',count:1,date:'2026.10.19 16:20',tax:'91310000XXXXXXXXXX',email:'finance@example.com',deliveryVersion:1,deliveries:[],invoiceNo:'DEMO-20261021-0028',issueDate:'2026-10-21',events:[['发票已交付，等待确认','2026.10.21 15:30','财务已上传 PDF 原件。'],['审核通过','2026.10.20 10:10','开票资料审核通过。'],['申请已提交','2026.10.19 16:20','1 笔充值订单，共 ¥800.00。']]},
    {id:'INV-20261015-0021',title:'林先生',amount:29900,status:'approved_for_issue',sources:'会员订阅',count:1,date:'2026.10.15 11:00',tax:'',email:'lin@example.com',events:[['审核通过，待开票','2026.10.16 09:25','开票资料已核对。'],['申请已提交','2026.10.15 11:00','基础会员月度订阅。']]},
    {id:'INV-20261010-0015',title:'上海示例科技有限公司',amount:69900,status:'disputed',sources:'会员订阅',count:1,date:'2026.10.10 13:40',tax:'91310000XXXXXXXXXX',email:'finance@example.com',deliveryVersion:1,deliveries:[],invoiceNo:'DEMO-20261012-0015',issueDate:'2026-10-12',dispute:'发票中的公司名称少了“科技”二字，请核对后补发。',events:[['用户提出异议','2026.10.13 09:10','抬头信息有误，请核对后补发。'],['发票已交付','2026.10.12 14:20','第 1 版发票已发送。']]}
  ];
  const statusMap = {pending_review:['待审核','amber'],approved_for_issue:['待开票',''],delivered:['待确认',''],awaiting_reconfirmation:['待重新确认',''],confirmed:['已确认','green'],disputed:['异议处理中','red'],rejected:['已拒绝','gray']};
  let state = {role:'user',tab:'apply',step:1,filter:'全部',selected:[],kind:'企业',title:'',tax:'',email:'',note:'',savedHead:false,consent:false,requestId:requests[1].id,queue:'pending_review',adminId:requests[0].id,search:'',error:'',toast:'',dialog:null,reissuingId:null,nextRequestNumber:37};
  const saved = globalThis.openai?.widgetState?.privateContent;
  if(saved && ['user','admin'].includes(saved.role)) { state.role=saved.role; if(['apply','records','heads'].includes(saved.tab))state.tab=saved.tab; }
  const money = n => (n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = n => `<i class="iv-icon" data-lucide="${n}" aria-hidden="true"></i>`;
  const button = (label,action,cls='',disabled=false) => `<button type="button" class="iv-btn cursor-interaction ${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
  const badge = r => `<span class="iv-tag ${statusMap[r.status][1]}">${statusMap[r.status][0]}</span>`;
  const picked = () => orders.filter(o=>state.selected.includes(o.id));
  const sum = () => picked().reduce((a,o)=>a+o.amount,0);
  const record = () => requests.find(r=>r.id===state.requestId) || requests[0];
  const currentAdmin = () => requests.find(r=>r.id===state.adminId) || requests[0];
  function persist() { globalThis.openai?.setWidgetState?.({modelContent:{design:'发票中心推荐方案',view:state.role,page:state.tab},privateContent:{role:state.role,tab:state.tab}})?.catch(()=>{}); }
  function lucideIcons(){ globalThis.lucide?.createIcons({attrs:{width:17,height:17}}); }
  function heading(admin=false) { return `<div class="iv-heading"><div><div class="iv-eyebrow">${admin?'FINANCE WORKSPACE':'BILLING & INVOICES'}</div><h1>${admin?'发票管理':'发票中心'}</h1><p class="iv-subtitle">${admin?'从审核到交付，每笔申请都有据可查。':'充值与会员订阅，一处申请、查看和管理。'}</p></div>${admin?`<span class="iv-tag green">财务工作台</span>`:button(icon('plus')+' 申请开票','new')}</div>`; }
  function footer(){return `<div class="iv-footer"><span>KKAI · new-api / QuantumNous</span><span>发票资料仅用于开票与必要的财务留存</span></div>`;}
  function steps(){return `<div class="iv-steps" aria-label="申请进度">${['选择订单','发票信息','核对提交'].map((s,i)=>`${i?'<span class="iv-step-line"></span>':''}<span class="iv-step ${state.step===i+1?'current':state.step>i+1?'done':''}" ${state.step===i+1?'aria-current="step"':''}><b>${state.step>i+1?'✓':i+1}</b>${s}</span>`).join('')}</div>`;}
  function summary(){return `<aside><div class="iv-panel iv-summary"><h3>本次申请</h3><div class="iv-summary-label">开票金额</div><div class="iv-amount iv-numeric"><span>¥</span>${money(sum())}</div><div class="iv-mini iv-muted" style="margin-top:6px">已选择 ${state.selected.length} 笔订单 · 人民币 CNY</div><hr class="iv-rule"><div class="iv-dl"><span>账户充值</span><span>${picked().filter(o=>o.kind==='充值').length} 笔</span></div><div class="iv-dl"><span>会员订阅</span><span>${picked().filter(o=>o.kind==='会员订阅').length} 笔</span></div><div class="iv-dl"><span>发票类型</span><span>电子普通发票</span></div><div class="iv-dl"><span>交付方式</span><span>站内下载 / 邮件提醒</span></div><hr class="iv-rule">${state.step===1?button('下一步：填写发票信息 '+icon('arrow-right'),'next','primary wide',!state.selected.length):state.step===2?button('下一步：核对并提交 '+icon('arrow-right'),'next','primary wide'):button('提交开票申请','submit','primary wide',!state.consent)}${state.step>1?`<button type="button" class="iv-link cursor-interaction" style="margin-top:13px" data-action="back">${icon('arrow-left')} 返回上一步</button>`:''}<div class="iv-note">${icon('shield-check')}<span>按订单实付金额开票；申请提交后锁定所选订单，避免重复申请。</span></div></div><div class="iv-note" style="padding:0 7px">${icon('circle-help')}<span>不确定如何申请？<br><button class="iv-link cursor-interaction" data-action="rules">查看开票说明</button></span></div></aside>`;}
  function orderList(){let shown=orders.filter(o=>state.filter==='全部'||o.kind===state.filter);return `<div class="iv-panel"><div class="iv-panel-head"><h3>选择开票订单</h3><span class="iv-mini iv-muted">同一开票主体 · CNY</span></div><div class="iv-tools">${['全部','充值','会员订阅'].map(f=>`<button type="button" class="iv-filter cursor-interaction ${state.filter===f?'active':''}" data-filter="${f}" aria-pressed="${state.filter===f}">${f}</button>`).join('')}</div><div class="iv-table-header"><input type="checkbox" class="iv-check cursor-interaction" id="iv-select-all" aria-label="选择当前筛选下全部可开票订单" ${shown.filter(o=>o.eligible).length&&shown.filter(o=>o.eligible).every(o=>state.selected.includes(o.id))?'checked':''}><span>订单 / 支付时间</span><span class="iv-right">实付金额</span></div>${shown.map(o=>`<label class="iv-order ${state.selected.includes(o.id)?'selected':''} ${!o.eligible?'disabled':''}"><input type="checkbox" class="iv-check cursor-interaction" data-order="${o.id}" aria-label="${o.eligible?'选择'+esc(o.name)+' ¥'+money(o.amount):esc(o.name)+'，'+esc(o.reason||'暂不可申请')}" ${state.selected.includes(o.id)?'checked':''} ${!o.eligible?'disabled':''}><span><span class="iv-order-name">${o.name}<span class="iv-source">${o.kind}</span></span><span class="iv-order-ref">${o.trade}</span><span class="iv-order-meta" style="display:block">${o.date} · ${o.pay}</span>${!o.eligible?`<span class="iv-order-meta" style="display:block;color:var(--iv-amber)">${esc(o.reason||'暂不可申请')}</span>`:''}</span><span class="iv-right"><span class="iv-numeric" style="font-weight:500">${o.amount!==null?'¥'+money(o.amount):'待核验'}</span><span class="iv-order-meta" style="display:block">${o.eligible?'可开票 · 实付已核验':o.claimedBy?'申请已占用':'待人工核验'}</span></span></label>`).join('')}<div class="iv-panel-foot"><span>充值与会员订单 · 不可申请原因逐笔展示</span><span>${shown.length} 笔订单</span></div></div>`;}
  function form(){return `<div class="iv-panel"><div class="iv-panel-head"><h3>填写发票信息</h3><span class="iv-mini iv-muted">电子普通发票</span></div><div class="iv-panel-body">${state.error?`<div class="iv-error" role="alert">${esc(state.error)}</div>`:''}<div class="iv-choice" aria-label="抬头类型">${['企业','个人'].map(k=>`<button type="button" class="cursor-interaction" data-kind="${k}" aria-pressed="${state.kind===k}">${icon(k==='企业'?'building-2':'user-round')} ${k}抬头</button>`).join('')}</div>${state.savedHead?`<button type="button" class="iv-link cursor-interaction" style="margin-bottom:14px" data-action="use-head">${icon('bookmark')} 使用常用抬头</button>`:''}<label class="iv-field">发票抬头 <em>*</em><input id="iv-form-title" autocomplete="organization" placeholder="${state.kind==='企业'?'请输入完整企业名称':'请输入姓名'}" value="${esc(state.title)}" required></label>${state.kind==='企业'?`<label class="iv-field">纳税人识别号 <em>*</em><input id="iv-form-tax" placeholder="请输入纳税人识别号" value="${esc(state.tax)}" required><small class="iv-muted">请与企业税务登记信息保持一致。</small></label>`:''}<label class="iv-field">接收邮箱 <em>*</em><input type="email" id="iv-form-email" autocomplete="email" placeholder="finance@example.com" value="${esc(state.email)}" required><small class="iv-muted">发票可在站内下载，邮箱用于接收进度提醒。</small></label><label class="iv-field">补充说明 <span class="iv-muted">（选填）</span><textarea id="iv-form-note" maxlength="500" placeholder="如有特殊开票要求，请在此说明">${esc(state.note)}</textarea></label><label class="iv-check-label"><input type="checkbox" class="iv-check" id="iv-save-head" ${state.savedHead?'checked':''}><span>保存为常用抬头，下次申请时使用</span></label></div></div>`;}
  function verify(){return `<div class="iv-panel"><div class="iv-panel-head"><h3>核对申请信息</h3><button class="iv-link cursor-interaction" data-action="edit">修改信息</button></div><div class="iv-panel-body"><div class="iv-soft-note">提交后将进入人工审核。请仔细核对抬头、税号和金额。</div>${[['抬头类型',state.kind+'抬头'],['发票抬头',state.title],...(state.kind==='企业'?[['纳税人识别号',state.tax]]:[]),['接收邮箱',state.email],['发票类型','电子普通发票'],['开票金额','¥'+money(sum())],...(state.note?[['补充说明',state.note]]:[])].map(([k,v])=>`<div class="iv-data-row"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}<hr class="iv-rule"><h3 style="margin-bottom:12px">关联订单 · ${picked().length} 笔</h3>${picked().map(o=>`<div class="iv-dl"><span>${o.name}</span><span class="iv-numeric">¥${money(o.amount)}</span></div>`).join('')}<hr class="iv-rule"><label class="iv-check-label"><input type="checkbox" class="iv-check" id="iv-consent" ${state.consent?'checked':''}><span>我已核对开票资料，并确认所选订单未在其他渠道开票。</span></label></div></div>`;}
  function userPage(){const eligible=orders.filter(o=>o.eligible);const processing=requests.filter(r=>['pending_review','approved_for_issue','disputed'].includes(r.status)).length;return `${heading()}<div class="iv-balance"><div class="iv-balance-item"><div class="iv-balance-label">可申请开票</div><div class="iv-balance-value iv-numeric"><span>¥</span>${money(eligible.reduce((a,o)=>a+o.amount,0))}</div><div class="iv-balance-meta">${eligible.length} 笔已付款订单</div></div><div class="iv-balance-item"><div class="iv-balance-label">申请处理中</div><div class="iv-balance-value iv-numeric">${processing}<span style="padding-left:5px">笔</span></div><div class="iv-balance-meta">审核、开票或异议处理中</div></div><div class="iv-balance-item"><div class="iv-balance-label">待确认发票</div><div class="iv-balance-value iv-numeric">${requests.filter(r=>['delivered','awaiting_reconfirmation'].includes(r.status)).length}<span style="padding-left:5px">张</span></div><div class="iv-balance-meta">查看后确认或提出异议</div></div></div><nav class="iv-tabs" aria-label="发票中心功能">${[['apply','申请开票'],['records','申请记录'],['heads','常用抬头']].map(([id,label])=>`<button type="button" class="iv-tab cursor-interaction ${state.tab===id?'active':''}" data-tab="${id}" aria-pressed="${state.tab===id}">${label}${id==='records'?`<span class="iv-count">${requests.length}</span>`:''}</button>`).join('')}</nav>${state.tab==='apply'?`${steps()}<div class="iv-workspace"><div>${state.step===1?orderList():state.step===2?form():verify()}</div>${summary()}</div>`:state.tab==='records'?userRecords():heads()}${footer()}`;}
  function timeline(r){return `<h3>处理进度</h3><ol class="iv-timeline">${r.events.map(([name,date,desc])=>`<li><div>${esc(name)}</div><time>${date}</time><div class="iv-muted" style="margin-top:4px">${esc(desc)}</div></li>`).join('')}</ol>`;}
  function fileRow(r){if(!r.deliveryVersion)return '';return `<div class="iv-file"><span class="iv-file-icon">${icon('file-text')}</span><span class="iv-file-copy">电子发票 · 第 ${r.deliveryVersion} 版.pdf<br><small>PDF 原件 · 286 KB</small></span><button type="button" class="iv-link cursor-interaction" data-preview="${r.id}" aria-label="预览发票">${icon('eye')} 预览</button></div>`;}

  function adminPage(){const queue=requests.filter(r=>state.queue==='all'||r.status===state.queue);const shown=queue.filter(r=>(r.id+r.title).toLowerCase().includes(state.search.toLowerCase()));let r=shown.find(q=>q.id===state.adminId)||shown[0];if(r)state.adminId=r.id;return `${heading(true)}<div class="iv-queue-tabs">${[['pending_review','待审核'],['approved_for_issue','待开票'],['disputed','异议待办'],['all','全部申请']].map(([k,n])=>`<button type="button" class="iv-queue-tab cursor-interaction ${state.queue===k?'active':''}" data-queue="${k}" aria-pressed="${state.queue===k}">${n}<b>${k==='all'?requests.length:requests.filter(q=>q.status===k).length}</b></button>`).join('')}</div><div class="iv-admin-grid"><section class="iv-panel"><div class="iv-tools">${icon('search')}<input class="iv-search" id="iv-admin-search" aria-label="按申请号或抬头搜索" placeholder="搜索申请号 / 抬头" value="${esc(state.search)}"></div><div class="iv-list">${shown.length?shown.map(q=>`<button class="iv-request cursor-interaction ${q.id===r.id?'active':''}" data-admin-request="${q.id}"><span><span class="iv-request-title" style="display:block">${esc(q.title)}</span><span class="iv-mini iv-muted">${q.id}</span><br>${badge(q)}</span><span class="iv-right iv-numeric" style="font-weight:500">¥${money(q.amount)}</span><span class="iv-mini iv-muted" style="grid-column:1/-1">${q.sources} · ${q.count} 笔订单</span></button>`).join(''):'<div class="iv-empty">当前没有待办申请</div>'}</div><div class="iv-panel-foot"><span>共 ${shown.length} 笔申请</span><span>按提交时间排序</span></div></section>${r?adminDetail(r):'<div class="iv-panel iv-empty">当前队列已处理完毕</div>'}</div>${footer()}`;}
  function adminDetail(r){return `<section class="iv-panel"><div class="iv-panel-head"><div><h3>申请详情</h3><div class="iv-mini iv-muted" style="margin-top:4px">${r.id}</div></div>${badge(r)}</div><div class="iv-panel-body"><div class="iv-detail-top"><div><div class="iv-mini iv-muted">申请金额 · CNY</div><div class="iv-detail-total iv-numeric"><span>¥</span>${money(r.amount)}</div></div><span class="iv-tag green">支付凭证已核验</span></div><div class="iv-data-row"><span>申请用户</span><span>林先生 · ID 1042</span></div><div class="iv-data-row"><span>发票抬头</span><span>${esc(r.title)}</span></div><div class="iv-data-row"><span>纳税人识别号</span><span>${esc(r.tax||'个人抬头，无需税号')}</span></div><div class="iv-data-row"><span>发票类型</span><span>电子普通发票</span></div><div class="iv-data-row"><span>接收邮箱</span><span>${esc(r.email)}</span></div><hr class="iv-rule"><h3 style="margin-bottom:11px">关联订单 <span class="iv-muted iv-mini">${r.count} 笔 · ${r.status==='rejected'?'已释放':'已占用'}</span></h3>${(r.orderIds?r.orderIds.map(id=>orders.find(o=>o.id===id)).filter(Boolean).map(o=>[o.name,o.kind,'¥'+money(o.amount)]):r.count===2?[['账户充值','充值','¥500.00'],['专业会员 · 月度订阅','会员订阅','¥699.00']]:[[r.sources,r.sources,'¥'+money(r.amount)]]).map(([name,source,amount])=>`<div class="iv-dl"><span style="color:var(--iv-text)">${name}<span class="iv-source" style="margin-left:5px">${source}</span></span><span class="iv-numeric">${amount}</span></div>`).join('')}<hr class="iv-rule">${r.status==='pending_review'?`<div class="iv-soft-note">审核通过后进入待开票。上传并交付发票后，用户才能确认或反馈。</div><div class="iv-actions">${button('拒绝申请','reject','danger')}${button(icon('check')+' 审核通过','approve','primary')}</div>`:r.status==='approved_for_issue'?uploadForm(r):r.status==='disputed'?(state.reissuingId===r.id?`${fileRow(r)}<hr class="iv-rule">${uploadForm(r)}`:disputeAdmin(r)):`${fileRow(r)}<hr class="iv-rule">${timeline(r)}`}</div></section>`;}

  function render(){root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===state.role)));root.querySelector('#iv-nav-active').textContent=state.role==='admin'?'发票管理':'发票中心';root.querySelector('#iv-title').textContent=state.role==='admin'?'发票管理':'发票中心';root.querySelector('#iv-crumb').textContent=state.role==='admin'?'管理控制台':'账户与账务';root.querySelector('#iv-user-name').textContent=state.role==='admin'?'财务管理员':'林先生';root.querySelector('#iv-user-role').textContent=state.role==='admin'?'财务操作权限':'个人工作空间';content.innerHTML=(state.toast?`<div class="iv-toast" role="status">${icon('circle-check')}${esc(state.toast)}</div>`:'')+(state.role==='user'?userPage():adminPage());lucideIcons();}

    if(action==='deliver'){const file=root.querySelector('#iv-upload-file')?.files?.[0];const number=root.querySelector('#iv-invoice-number').value.trim();const date=root.querySelector('#iv-invoice-date').value;const value=root.querySelector('#iv-invoice-amount').value;const r=currentAdmin();let error='';if(!file&&!state.demoFile)error='请先上传发票文件。';else if(file&&(!['application/pdf','image/png','image/jpeg'].includes(file.type)||file.size>20*1024*1024))error='仅支持 20 MB 以内的 PDF、PNG 或 JPEG。';else if(!number||!date)error='请填写发票号码和开票日期。';else if(!/^\d+(\.\d{1,2})?$/.test(value)||Math.round(Number(value)*100)!==r.amount)error='开票金额必须与申请金额一致。';if(error){state.error=error;let b=root.querySelector('#iv-issue-error');if(!b){b=document.createElement('div');b.id='iv-issue-error';b.setAttribute('role','alert');b.className='iv-error';root.querySelector('.iv-upload').before(b);}b.textContent=error;return;}if(r.status!=='approved_for_issue'&&!(r.status==='disputed'&&state.reissuingId===r.id))return;if(r.deliveryVersion){r.deliveries.push({version:r.deliveryVersion,invoiceNo:r.invoiceNo,issueDate:r.issueDate});}r.deliveryVersion=(r.deliveryVersion||0)+1;r.status='delivered';r.invoiceNo=number;r.issueDate=date;state.reissuingId=null;event(r,'发票已交付，等待确认','已上传原始文件并通知用户。');state.demoFile=false;state.toast='发票已交付，用户可查看附件并确认或反馈。';state.queue='all';}
    if(action==='resolve'||action==='reissue'){const text=root.querySelector('#iv-resolution').value.trim();if(!text){let b=root.querySelector('#iv-resolution-error');if(!b){b=document.createElement('div');b.className='iv-error';b.id='iv-resolution-error';b.setAttribute('role','alert');root.querySelector('#iv-resolution').after(b);}b.textContent='请填写处理回复。';return;}const r=currentAdmin();if(action==='resolve'){r.status='awaiting_reconfirmation';state.reissuingId=null;event(r,'财务已回复，请用户核对',text);state.queue='all';state.toast='回复已发送，等待用户再次核对。';}else{state.reissuingId=r.id;state.demoFile=false;event(r,'进入更正补发',text);state.queue='disputed';state.toast='请上传更正后的发票；原版本继续保留。';}}
    if(action==='add-head'||action==='edit-head'){dialog(action==='add-head'?'新建常用抬头':'编辑常用抬头',`<label class="iv-field">企业名称<input id="iv-head-name" value="${esc(state.title)}" placeholder="上海示例科技有限公司"></label><label class="iv-field">纳税人识别号<input id="iv-head-tax" value="${esc(state.tax)}" placeholder="请输入纳税人识别号"></label><label class="iv-field">接收邮箱<input type="email" id="iv-head-email" value="${esc(state.email)}" placeholder="finance@example.com"></label><div id="iv-dialog-error" role="alert"></div>`,button('取消','close')+button('保存抬头','save-head','primary'));return;}
    if(action==='save-head'){const name=modal.querySelector('#iv-head-name').value.trim();const tax=modal.querySelector('#iv-head-tax').value.trim();const email=modal.querySelector('#iv-head-email').value.trim();if(!name||!/^[A-Za-z0-9]{15,20}$/.test(tax)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){modal.querySelector('#iv-dialog-error').innerHTML='<div class="iv-error">请填写完整企业名称、有效税号和邮箱。</div>';return;}state.title=name;state.tax=tax;state.email=email;state.savedHead=true;closeDialog();state.toast='常用抬头已保存。';}
    render();persist();
  });
  root.addEventListener('change',e=>{const input=e.target;if(input.dataset.order){if(input.checked)state.selected.push(input.dataset.order);else state.selected=state.selected.filter(id=>id!==input.dataset.order);render();}if(input.id==='iv-select-all'){const ids=orders.filter(o=>o.eligible&&(state.filter==='全部'||o.kind===state.filter)).map(o=>o.id);state.selected=input.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(id=>!ids.includes(id));render();}if(input.id==='iv-consent'){state.consent=input.checked;render();}if(input.id==='iv-save-head')state.savedHead=input.checked;});
  root.addEventListener('input',e=>{const id=e.target.id;if(id==='iv-form-title')state.title=e.target.value;if(id==='iv-form-tax')state.tax=e.target.value;if(id==='iv-form-email')state.email=e.target.value;if(id==='iv-form-note')state.note=e.target.value;if(id==='iv-admin-search'){const pos=e.target.selectionStart;state.search=e.target.value;render();const field=root.querySelector('#iv-admin-search');field.focus();field.setSelectionRange(pos,pos);}});
  root.addEventListener('keydown',e=>{if(!modal.firstChild)return;if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const all=[...modal.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all[all.length-1].focus();}else if(!e.shiftKey&&document.activeElement===all[all.length-1]){e.preventDefault();all[0].focus();}}});
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&['user','admin'].includes(s.role)){state.role=s.role;if(['apply','records','heads'].includes(s.tab))state.tab=s.tab;render();}});
  render();
  if(globalThis.Tweak){const design={radius:12};const t=new Tweak({container:root,onChange:()=>root.style.setProperty('--iv-radius',design.radius+'px')});t.addSlider(design,'radius',{label:'面板圆角',min:8,max:18,unit:'px',reference:'--iv-radius'});}
})();
</script>
