<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>视频工作室任务页设计稿 | KKAI · new-api</title>
    <link rel="stylesheet" href="tasks-redesign.css" />
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-film" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M7 3v18M17 3v18M3 8h4m-4 8h4m10-8h4m-4 8h4" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 11.7-3L20 8M4 16l2.8 3A7 7 0 0 0 18.5 16" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m7 4 14 8-14 8Z" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M8 3H3v5m0-5 6 6m7-6h5v5m0-5-6 6M3 16v5h5m-5 0 6-6m12 1v5h-5m5 0-6-6" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="13" rx="2" />
        <path d="M16 8V3H3v13h5" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-5-5 5 5-5 5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="m12 3 10 18H2Z" />
        <path d="M12 9v5m0 3h.01" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v6l4 2" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z" />
      </symbol>
    </svg>

    <div class="review-bar">
      <div class="review-identity">
        <span class="review-mark">DESIGN REVIEW</span
        ><span>任务页重设计 · 示例数据与素材 · 不连接生产</span>
      </div>
      <label for="review-scene"
        >审查场景
        <select id="review-scene">
          <option value="ready">可播放</option>
          <option value="failed">失败</option>
          <option value="processing">生成中</option>
          <option value="queued">排队中</option>
          <option value="archiving">归档中</option>
          <option value="empty">空列表</option>
          <option value="error">读取失败</option>
        </select></label
      >
    </div>

    <div class="shell">
      <header class="global-bar">
        <div class="global-brand"><span class="brand-symbol">K</span><strong>KKAI</strong></div>
        <nav class="global-links" aria-label="全站导航">
          <span>主页</span><span>控制台</span><span>商城</span><span>模型广场</span
          ><span>会员倍率</span><span>排行榜</span><span>文档</span><span>关于</span>
        </nav>
        <div class="global-actions">
          <span class="global-search">⌕ 搜索</span><span class="avatar">R</span>
        </div>
      </header>

      <main class="page">
        <header class="page-header">
          <div class="page-title">
            <span class="eyebrow">VIDEO STUDIO</span>
            <h1>视频工作室<span class="title-dot"></span></h1>
          </div>
          <nav class="studio-tabs" aria-label="视频工作室页面">
            <span
              ><svg><use href="#i-film" /></svg>创作</span
            >
            <span
              ><svg><use href="#i-folder" /></svg>作品库</span
            >
            <span class="selected" aria-current="page"
              ><svg><use href="#i-list" /></svg>任务</span
            >
          </nav>
        </header>

        <div class="workspace-heading">
          <div>
            <span class="section-kicker">TASK QUEUE</span>
            <h2>任务</h2>
          </div>
          <button class="refresh-button" type="button" id="refresh-button">
            <svg><use href="#i-refresh" /></svg><span>刷新</span>
          </button>
        </div>

        <div class="task-workspace" id="task-workspace"></div>
        <footer class="product-footer">Powered by <strong>new-api</strong> · QuantumNous</footer>
      </main>
    </div>

    <dialog id="mobile-detail" aria-label="任务详情"></dialog>
    <dialog id="preview-dialog" aria-label="封面预览">
      <button
        type="button"
        class="preview-close icon-button"
        data-action="close-preview"
        aria-label="关闭预览"
      >
        <svg><use href="#i-close" /></svg></button
      ><img src="assets/city-ride-cinematic.webp" alt="雨后城市骑行视频示例封面" />
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="tasks-redesign.js"></script>
  </body>
</html>
