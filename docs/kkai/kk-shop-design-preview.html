/span><strong>回到订单领取</strong><p>交付与售后进展，集中查看。</p></li></ol></div></section></main>${footer()}`}

function checkout(){const x=p(),manual=x.delivery==='人工交付',unknown=state.scenario==='checking',unavailable=state.scenario==='soldout'||!x.stock,blocked=state.scenario==='nochannel'||unavailable;return `<main id="main" class="container content">${crumbs('确认订单')}<div class="steps"><span>01 选择商品</span><i></i><span class="active">02 确认与付款</span><i></i><span>03 查看交付</span></div>${heading(unknown?'正在核实付款':'确认这份选择','虚拟商品 · 每单 1 件 · 商品与条款均为演示')}<div class="checkout-grid receipt-layout"><div class="stack">${unavailable?callout('此商品当前无可用库存或接单容量，无法创建付款订单。请返回商品列表选择其他商品。','amber','暂时无法购买'):''}${state.scenario==='pricechanged'?callout('演示价格从 ¥35 调整为 ¥39。请重新阅读当前价格和规则，并重新确认购买。','amber','商品信息有更新'):''}<section class="panel"><h3><span class="section-num">1</span> 商品与交付</h3><div class="row">${mini(x)}<div class="grow"><h3 style="margin:0">${esc(x.name)}</h3><p class="muted mt8" style="font-size:12px">${esc(x.spec)} · 数量 1</p>${badge(x.delivery,manual?'amber':'blue')}</div></div><div class="rule"></div>${manual?`<div class="field"><label for="buyer-email">联系邮箱 <span class="muted">· 用于本单履约</span></label><input id="buyer-email" type="email" placeholder="your-name@example.test" value="${esc(state.manualInfo)}"><small>无需提供登录密码、支付密码或短信验证码。</small></div>${callout('演示：付款确认且资料齐全后 24 个自然小时内完成，Asia/Shanghai。后续补充资料不自动重置承诺时间。')}`:callout('服务端确认付款后自动交付。交付完成后，可在本人的订单中查看专属内容。')}</section><section class="panel"><h3><span class="section-num">2</span> 付款方式</h3>${blocked?callout(unavailable?'商品当前不可购买，不会创建支付入口。':'当前暂无可用支付渠道。请稍后再试，尚未创建付款。','amber'):unknown?callout('正在核实原付款结果，请勿重复支付。页面关闭后，仍可在订单中查看进度。','amber'): `<div class="payment-option"><span class="radio-dot"></span>${icon('card')}<div><strong style="font-size:12px">现有支付渠道</strong><p class="muted" style="font-size:11px">演示入口 · 真实渠道与币种待确认</p></div>${badge('已选择')}</div><p class="muted mt16" style="font-size:11px">该笔款项仅用于本订单，不充值 API 余额。</p>`}</section><section class="panel"><h3><span class="section-num">3</span> 购买须知</h3><ul class="bullet-list"><li>演示：商品使用期 const orderStates={refund_failed:['退款失败，仍在跟进','原商品款退款责任保留。需核实旧尝试已结束后，再登记下一次关联尝试。','amber','alert'],pending:['待付款','请在订单保留时间内完成付款。','blue','clock'],checking:['付款核实中','正在核实原付款结果，请勿重复支付。','amber','clock'],closed:['订单已关闭','本次购买已结束；若已付款，付款核实仍会继续。','','receipt'],delivered:['已交付，可查看内容','你的数字商品已准备好，请在下方安全查看交付内容。','green','circlecheck'],manual:['已付款，待人工交付','演示：最晚 2026-10-28 14:32（Asia/Shanghai）完成。','blue','clock'],missing:['等待补充信息','请补充本单所需的联系邮箱，资料齐全后开始约定交付时限。','amber','user'],late:['已收到付款，交付待处理','付款在订单保留到期后确认，当前暂无可用库存。我们正在处理。','amber','alert'],duplicate:['已交付，额外付款处理中','正常商品交付继续有效，额外款项有独立退款处理记录。','green','circlecheck'],after:['售后处理中','我们已收到你的问题，当前交付内容仍可查看。','blue','support'],paused:['交付内容暂不可查看','因本单凭据异常已暂停查看，正在核实并处理。','amber','lock'],expired:['交付查看期限已结束','本单约定的内容查看期限已结束，历史订单和售后记录仍可查看。','','lock'],refund:['退款处理中，结果待核实','原商品款退款已批准；正在核实原路退款结果，新的交付与查看已暂停。','amber','clock'],refunded:['支付渠道已确认退款','演示：¥39.00 CNY 已原路退回，实际到账时间以支付渠道与银行为准。','','circlecheck'],reissued:['补发已完成','新的交付内容已准备好。原交付记录保留，旧内容不再展示。','green','circlecheck']};
function currentStatus(){if(orderProduct().id===1&&state.refundVerified)return'refunded';if(orderProduct().id===1&&state.refundApproved)return state.refunds.original?.stage==='failed'?'refund_failed':'refund';if(state.risks[orderProduct().id]?.paused)return'paused';if(state.viewExpired&&!state.reissueCompleted)return'expired';if(state.manualSubmitted)return'delivered';if(state.afterSubmitted)return'after';return orderStates[state.scenario]?state.scenario:'delivered'}

function refundDialog(scope){if(scope==='original')bindOriginalOrder();state.refundScope=scope;const r=refundRecord(scope),a=r.attempts.at(-1);const fields=r.stage==='none'?`<div class="field mt16"><label for="refund-step-reason">审批理由</label><textarea id="refund-step-reason"></textarea></div>`:r.stage==='approved'?`<div class="field mt16"><label for="refund-step-reference">本次渠道退款引用</label><input id="refund-step-reference" placeholder="${r.id}-ATTEMPT-${r.attempts.length+1}"></div><div class="field"><label for="refund-step-evidence">渠道操作证据摘要（演示）</label><textarea id="refund-step-evidence" placeholder="记录商户、原收款、金额币种、操作结果与证据引用；不填真实凭证。"></textarea></div>`:r.stage==='evidence'?`<div class="field mt16"><label for="refund-step-result">渠道核实结论（演示）</label><select id="refund-step-result"><option value="unknown">未知 / 保持待核实</option><option value="mismatch">证据不匹配 / 保持待核实</option><option value="failed">渠道确认失败</option><option value="success">已匹配原交易、商户、金额与渠道成功结果</option></select></div><div class="field"><label for="refund-step-result-note">核实依据 / 失败原因</label><textarea id="refund-step-result-note"></textarea></div>`:r.stage==='failed'?`${callout('退款失败不解除原责任。只有核实旧尝试已结束、没有成功或在途退款、没有未决拒付/扣回，才可登记下一次关联尝试。','amber')}<div class="field mt16"><label for="refund-retry-check">旧尝试和资金状态（演示）</label><select id="refund-retry-check"><option value="unknown">尚未核实</option><option value="inflight">仍有在途/结果未知退款</option><option value="success">已发现成功退款</option><option value="chargeback">存在未决拒付或扣回</option><option value="clear">旧尝试已终止且无成功/在途退款、无拒付扣回</option></select></div><div class="field"><label for="refund-retry-evidence">核实旧尝试已结束的证据与继续理由</label><textarea id="refund-retry-evidence"></textarea></div>`:callout('演示渠道已确认该笔退款。不会自动回库或修改其他收款。','green');const labels={none:'批准并建立退款责任',approved:'登记本次尝试，待核实',evidence:'保存核实结论',failed:'核实后准备下一次关联尝试',success:'关闭'};modal(scope==='original'?'原商品款退款':scope==='extra'?'额外重复款 · 独立退款':'付款差错 · 原收款退款',`${callout(scope==='original'?'批准后停止新交付与秘密揭示；批准不等于退款成功。':'只处理当前指定收款，不退其他商品款，也不自动改变合法交付。','blue')}<dl class="facts mt24"><div class="fact"><dt>原收款</dt><dd>${r.payment}</dd></div><div class="fact"><dt>退款责任</dt><dd>${r.stage==='none'?'审批后建立 '+r.id:r.id}</dd></div><div class="fact"><dt>全额金额</dt><dd>${r.amount}.00 ${r.currency} · 演示</dd></div><div class="fact"><dt>状态</dt><dd>${refundStageLabel(r.stage)}</dd></div></dl>${r.attempts.length?`<h4 class="mt24">关联尝试历史</h4><ul class="timeline mt16">${r.attempts.map((x,i)=>`<li>尝试 ${i+1} · ${esc(x.reference)} · ${esc(x.result)}<p>${esc(x.note||x.evidence)}</p></li>`).join('')}</ul>`:''}${r.notes.length?`<h4>处理依据</h4><ul class="timeline mt16">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${fields}<p class="muted mt16">退款责任不换号；下一次渠道操作另记关联尝试。这里只模拟证据，不把管理员选择本身当作真实资金证明。</p>`,button('关闭','close-dialog','outline')+button(labels[r.stage],r.stage==='success'?'close-dialog':'refund-step','primary'))}
function extraRefundDialog(){state.hasExtraPayment=true;refundDialog('extra')}
function riskDialog(){modal('订单风险 · 暂停与复核恢复',`<div class="field"><label for="risk-order">目标订单</label><select id="risk-order"><option value="1">KK2026102700381 · 自动交付</option><option value="3">KK2026102700376 · 人工交付</option></select></div><div class="field"><label for="risk-action">操作</label><select id="risk-action"><option value="pause">暂停新的交付与凭据查看</option><option value="resume">复核后解除风险暂停</option></select></div><div class="field"><label for="risk-reason">内部原因 / 复核依据</label><textarea id="risk-reason"></textarea></div><div class="field"><label for="risk-evidence">受限证据引用</label><input id="risk-evidence" placeholder="EVID-DEMO-RISK，不填完整凭据"></div><div class="field"><label for="risk-public">买家可见说明</label><textarea id="risk-public" placeholder="说明当前处理和下一步，不含内部风险判断或秘密。"></textarea></div>${callout('解除风险标记不会撤销退款、延长查看期限或重新交付；其他限制仍独立生效。','amber')}<ul class="timeline mt16">${state.riskLog.map(n=>`<li>${esc(n)}</li>`).join('')||'<li>尚无风险操作记录</li>'}</ul>`,button('取消','close-dialog','outline')+button('保存风险处理记录','risk-save','primary'))}
function paymentExceptionDialog(){const q=state.paymentException,fixture=q.kind==='short'?['PAY-DEMO-SHORT-0440','19.00 CNY']:q.kind==='currency'?['PAY-DEMO-CURRENCY-0440','39.00 USD']:['PAY-DEMO-UNMATCHED-0440','39.00 CNY'];modal('付款差错 · 原收款核实',`<dl class="facts"><div class="fact"><dt>可信渠道交易</dt><dd>${fixture[0]} · 实收 ${fixture[1]}</dd></div><div class="fact"><dt>渠道 / 商户 / 环境</dt><dd>DEMO-PAY / DEMO-MERCHANT / test</dd></div><div class="fact"><dt>关联目标订单</dt><dd>KK2026102700440 · 应付 39.00 CNY</dd></div><div class="fact"><dt>当前处理</dt><dd>${esc(({review:'待核实',matched:'已恢复原单映射',refund:'关联退款处理中'})[q.status]||q.status)} · ${esc(q.owner)}</dd></div></dl><div class="field mt24"><label for="exception-kind">可信证据场景（演示工具）</label><select id="exception-kind"><option value="short" ${q.kind==='short'?'selected':'disabled'}>实收 19.00 CNY / 应付 39.00 CNY</option><option value="currency" ${q.kind==='currency'?'selected':'disabled'}>实收 39.00 USD / 应付 39.00 CNY</option><option value="unmatched" ${q.kind==='unmatched'?'selected':q.kind==='matched'?'':'disabled'}>实收 39.00 CNY / 原订单映射缺失</option><option value="matched" ${q.kind==='matched'?'selected':q.kind==='unmatched'?'':'disabled'}>可信主动查单恢复完整映射，39.00 CNY 全部匹配</option></select></div><div class="field"><label for="exception-owner">处理责任人</label><input id="exception-owner" value="${esc(q.owner)}"></div><div class="field"><label for="exception-evidence">证据引用 / 处理记录</label><textarea id="exception-evidence" placeholder="演示签名回执 EVID-DEMO-0440；记录差异与下一步，不填真实密钥。"></textarea></div><div class="field"><label for="exception-action">处理动作</label><select id="exception-action"><option value="note">保留差错并记录进展</option><option value="restore">依可信完整匹配恢复映射</option><option value="refund">关联原收款差错退款</option></select></div>${callout('恢复必须由可信证据同时匹配交易、商户、环境、订单归属、金额与币种。短款或异币种不能手工确认成功；无法匹配则保留差错或按原实收退款。','amber')}<ul class="timeline mt16">${q.notes.map(n=>`<li>${esc(n)}</li>`).join('')||'<li>可信实收已保存；尚未确认为有效商品款</li>'}</ul>`,button('关闭','close-dialog','outline')+button('核对
