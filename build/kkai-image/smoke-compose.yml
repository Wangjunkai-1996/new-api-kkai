services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    pull_policy: never
    environment:
      POSTGRES_DB: newapi_stage
      POSTGRES_USER: newapi_stage
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    healthcheck:
      test: [CMD-SHELL, pg_isready --username=newapi_stage --dbname=newapi_stage]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    pull_policy: never
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [redis-server, /etc/redis/redis.conf]
    volumes:
      - ${TEST_ROOT:?TEST_ROOT is required}/redis.conf:/etc/redis/redis.conf:ro
      - ${TEST_ROOT:?TEST_ROOT is required}/redis-users.acl:/run/secrets/redis-users.acl:ro
    tmpfs:
      - /data:rw,nosuid,nodev,noexec,size=64m
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    healthcheck:
      test: [CMD, redis-cli, --user, health, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  newapi:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    platform: linux/amd64
    pull_policy: never
    init: true
    user: '10007:10007'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [--log-dir, '']
    environment:
      PORT: '3000'
      GIN_MODE: release
      NODE_TYPE: ${NEWAPI_NODE_TYPE:-slave}
      KKAI_NODE_ROLE: ${NEWAPI_NODE_ROLE:-serving}
      DISABLE_BACKGROUND_TASKS: 'true'
      BATCH_UPDATE_ENABLED: 'false'
      UPDATE_TASK: 'false'
      SQL_MAX_OPEN_CONNS: '8'
      SQL_MAX_IDLE_CONNS: '2'
      NEWAPI_DATABASE_HOST: postgres
      NEWAPI_DATABASE_PORT: '5432'
      NEWAPI_DATABASE_USER: newapi_stage
      NEWAPI_DATABASE_NAME: newapi_stage
      NEWAPI_DATABASE_SSLMODE: disable
      NEWAPI_REDIS_HOST: redis
      NEWAPI_REDIS_PORT: '6379'
      NEWAPI_REDIS_USER: newapi_stage
      NEWAPI_REDIS_DATABASE: '0'
      NEWAPI_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      NEWAPI_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      NEWAPI_SESSION_SECRET_FILE: /run/secrets/session_secret
      NEWAPI_CRYPTO_SECRET_FILE: /run/secrets/crypto_secret
      NEWAPI_INVITATIONS_INTERNAL_SECRET_FILE: /run/secrets/invitations_internal_secret
      NEWAPI_RISK_STREAM_SECRET_FILE: /run/secrets/risk_signing_secret
    secrets:
      - database_password
      - redis_password
      - session_secret
      - crypto_secret
      - invitations_internal_secret
      - risk_signing_secret
    tmpfs:
      - /data:rw,nosuid,nodev,noexec,size=256m,uid=10007,gid=10007,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10007,gid=10007,mode=1777
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/bin/wget, --quiet, --output-document=/dev/null, http://127.0.0.1:3000/api/status]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

secrets:
  database_password: {file: "${TEST_ROOT:?TEST_ROOT is required}/database-password"}
  redis_password: {file: "${TEST_ROOT:?TEST_ROOT is required}/redis-password"}
  session_secret: {file: "${TEST_ROOT:?TEST_ROOT is required}/session-secret"}
  crypto_secret: {file: "${TEST_ROOT:?TEST_ROOT is required}/crypto-secret"}
  invitations_internal_secret: {file: "${TEST_ROOT:?TEST_ROOT is required}/invitations-secret"}
  risk_signing_secret: {file: "${TEST_ROOT:?TEST_ROOT is required}/risk-signing-secret"}

volumes:
  postgres-data: {}
