name: KKAI Fork Quality

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - production/kkrich
      - 'rebuild/**'
      - 'upgrade/**'
  workflow_dispatch:

concurrency:
  group: kkai-fork-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.1'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run baseline-aware fork gate
        run: scripts/kkai/check-fork-quality.sh --full
