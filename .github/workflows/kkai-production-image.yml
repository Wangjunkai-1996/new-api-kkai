name: KKAI Production Image

on:
  push:
    branches:
      - production/kkrich
    paths-ignore:
      - '**/*.md'

permissions: {}

concurrency:
  group: kkai-production-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      IMAGE: ghcr.io/wangjunkai-1996/new-api-kkai
    steps:
      - name: Check out the production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve release coordinates
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_SEQUENCE: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/production/kkrich' ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_SHA}" == "$(git rev-parse HEAD)" ]]
          [[ "${RELEASE_SEQUENCE}" =~ ^[1-9][0-9]*$ ]]
          VERSION="kkai-prod-$(date -u +%Y%m%d).${RELEASE_SEQUENCE}-${SOURCE_SHA:0:9}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Linux AMD64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build/kkai-image/Dockerfile
          build-contexts: |
            kkai_image=./build/kkai-image
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.release.outputs.source_sha }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.release.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign the pushed image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  notify-infra:
    name: Notify private infrastructure intake
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch the immutable release coordinates
        env:
          GH_TOKEN: ${{ secrets.KKAI_INFRA_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${VERSION}" =~ ^kkai-prod-[0-9]{8}\.[1-9][0-9]*-[0-9a-f]{9}$ ]]
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --null-input \
            --arg source_sha "${SOURCE_SHA}" \
            --arg version "${VERSION}" \
            --arg digest "${DIGEST}" \
            '{
              event_type: "newapi_image_ready",
              client_payload: {
                source_sha: $source_sha,
                version: $version,
                digest: $digest
              }
            }' | gh api \
              --method POST \
              repos/Wangjunkai-1996/kkai-infra/dispatches \
              --input -
