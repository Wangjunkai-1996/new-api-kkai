name: KKAI Production Image

on:
  push:
    branches:
      - production/kkrich

concurrency:
  group: kkai-production-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/wangjunkai-1996/new-api-kkai
    steps:
      - name: Check out the selected production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Require the current production branch HEAD
        id: release
        run: |
          set -Eeuo pipefail
          RELEASE_SEQUENCE="${GITHUB_RUN_NUMBER}"
          [[ "${GITHUB_REF}" == 'refs/heads/production/kkrich' ]]
          [[ "${RELEASE_SEQUENCE}" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin production/kkrich
          SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "${SOURCE_SHA}" == "$(git rev-parse origin/production/kkrich)" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          VERSION="kkai-prod-$(date -u +%Y%m%d).${RELEASE_SEQUENCE}-${SOURCE_SHA:0:9}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run the complete fork quality gate
        run: scripts/kkai/check-fork-quality.sh --full

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the immutable Linux AMD64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build/kkai-image/Dockerfile
          build-contexts: |
            kkai_image=./build/kkai-image
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:candidate-${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.release.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pull and verify the immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          EXPECTED_SHA="${SOURCE_SHA}" EXPECTED_VERSION="${VERSION}" \
            EXPECTED_REGISTRY_DIGEST="${DIGEST}" \
            build/kkai-image/verify-image.sh "${IMAGE}@${DIGEST}"
          IMAGE_REF="${IMAGE}@${DIGEST}" EXPECTED_VERSION="${VERSION}" \
            PULL_DEPENDENCIES=true \
            build/kkai-image/smoke-compose.sh

      - name: Prepare security reports
        run: mkdir -p dist

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: dist/sbom.cdx.json

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: json
          output: dist/trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Revalidate the current production branch HEAD
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin production/kkrich
          [[ "${SOURCE_SHA}" == "$(git rev-parse origin/production/kkrich)" ]]

      - name: Promote the scanned digest to production tags
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            "${IMAGE}@${DIGEST}"
          PROMOTED_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "${PROMOTED_DIGEST}" == "${DIGEST}" ]]

      - name: Sign the immutable image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Export the offline release bundle
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          build/kkai-image/export-release.sh \
            "${IMAGE}@${DIGEST}" "${VERSION}" "${SOURCE_SHA}" "${DIGEST}" dist

      - name: Sign and verify the offline release manifest
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/kkai-production-image.yml@${{ github.ref }}
        run: |
          set -Eeuo pipefail
          cosign sign-blob --yes \
            --bundle dist/offline-release.sigstore.json \
            dist/offline-release.yml
          cosign verify-blob \
            --bundle dist/offline-release.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/offline-release.yml

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kkai-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release summary
        if: success()
        run: |
          {
            echo '### KKAI production image'
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Source: \`${{ steps.release.outputs.source_sha }}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
