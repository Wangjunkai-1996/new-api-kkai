name: Codex GHCR image (amd64)

on:
  push:
    branches:
      - codex/frt-header-display-rc5
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="v1.0.0-rc.5-frt-header-${SHORT_SHA}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${VERSION}" > VERSION
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=frt-header-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:frt-header-latest
          labels: |
            org.opencontainers.image.title=new-api
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "### Image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
