# Location-level ai-bridge pre-upstream risk guard.
#
# Include this inside each AI proxy location in:
#   /opt/ai-bridge/nginx/ai-bridge.locations.conf
#
# The include must appear before proxy_pass so rule hits fail closed before the
# request reaches the local ai-bridge upstream at 127.0.0.1:8080.

access_by_lua_file /opt/ai-risk-guard/nginx/ai_risk_guard_access.lua;
